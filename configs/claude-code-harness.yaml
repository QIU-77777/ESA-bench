# Job config: the same task driven by the Claude Code harness — the third
# member of the comparison pair (opencode-harness / pi-harness / claude-code-harness).
# Entry point is scripts/run.sh (it reads `model:` / `harness:`, maps the
# .env group, runs preflight, then `harbor run`).
#
# Model note: the gateway binds each model to one protocol. MiMo-V2.6-Flash
# only serves OpenAI's chat/completions protocol, and the gateway rejects it
# on the Anthropic protocol (HTTP 400 ModelProtocolUnsupported). Claude Code
# speaks the Anthropic protocol, so .env pins GO_ANTHROPIC_MODEL_ID to an
# Anthropic-protocol model (HTTP 200 verified on the /zen/go/v1/messages
# endpoint).
#
# Endpoints and model ids live in .env (one provider group per provider).
# `run.sh` uses `model: provider/model-id` to create a resolved temporary
# config before Harbor starts. There is no `env:` block: Harbor resolves
# ANTHROPIC_BASE_URL from the exported environment — it omits /v1 because the
# Claude SDK appends /v1/messages itself. The API key is injected at run time
# with --agent-env ANTHROPIC_API_KEY (value from .env) and never stored here.
#
# Combination declaration, read by run.sh (harbor's JobConfig ignores these
# two keys): model -> provider/model-id; the provider selects the matching
# .env group (go -> GO_*), and harness selects its manifest.
model: go/claude-haiku-5-5
harness: claude-code

jobs_dir: jobs
n_concurrent_trials: 4

# `tasks:` because the path points at a single task directory; a `datasets:`
# path must contain task subdirectories.
tasks:
  - path: tasks/hello-opencode

environment:
  type: docker
  import_path: harbor_test_env:HarborTestDockerEnvironment
  force_build: true
  delete: true
  mounts:
    # `source` must match harness/claude-code/manifest.yaml (run.sh preflight
    # enforces this); `target` must match the manifest's mount_path.
    - type: image
      source: harbor-test/harness/claude-code:2.1.299
      target: /usr/local
      read_only: true

agents:
  - import_path: harbor_test_agents:MountedClaudeCode
    name: Claude Code
    kwargs:
      # Reasoning effort passed as `--effort medium` (parity with the
      # `--thinking` flag of the opencode config and `thinking: medium` of
      # the pi config).
      reasoning_effort: medium
