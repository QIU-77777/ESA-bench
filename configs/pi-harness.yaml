# Job config: the same task as configs/opencode-harness.yaml, driven by the pi
# harness. The two files are the comparison pair — run both and compare
# reward, trajectory completeness (does the final answer step make it in?)
# and token accounting.
# Entry point is scripts/run.sh (it reads `model:` / `harness:`, maps the
# .env group, runs preflight, then `harbor run`).
#
# Endpoints and model ids live in .env (one provider group per provider).
# `run.sh` uses `model: provider/model-id` to create a resolved temporary
# config before Harbor starts. There is no `env:` block: Harbor resolves
# OPENAI_BASE_URL from the exported environment. The API key is injected at
# run time with --agent-env OPENAI_API_KEY (value from .env) and never stored
# here.
# Harbor's pi adapter writes pi's models.json from the OPENAI_BASE_URL /
# OPENAI_API_KEY pair at trial start.
#
# Combination declaration, read by run.sh (harbor's JobConfig ignores these
# two keys): model -> provider/model-id; the provider selects the matching
# .env group (deepseek -> DEEPSEEK_*), and harness selects its manifest.
model: deepseek/deepseek-flash
harness: pi

jobs_dir: jobs
n_concurrent_trials: 4

# `tasks:` because the path points at a single task directory; a `datasets:`
# path must contain task subdirectories.
tasks:
  - path: tasks/hello-opencode

environment:
  type: docker
  import_path: harbor_test_env:HarborTestDockerEnvironment
  force_build: true
  delete: true
  mounts:
    # `source` must match harness/pi/manifest.yaml (run.sh preflight enforces
    # this); `target` must match the manifest's mount_path.
    - type: image
      source: harbor-test/harness/pi:1.2.0
      target: /usr/local
      read_only: true

agents:
  - import_path: harbor_test_agents:MountedPi
    name: Pi
    kwargs:
      # API style of the gateway (OpenAI-compatible chat completions);
      # required for pi's custom-endpoint models.json.
      model_api: openai-completions
      # Same reasoning level the opencode config gets via `--thinking`.
      thinking: medium
