# Job config: everything the run needs except secrets. Endpoints, model ids
# and api keys live in .env (one <PREFIX>_* group per provider). `run.sh`
# uses `model: provider/model-id` to create a resolved temporary config before
# Harbor starts, and `{env:VAR}` supplies the connection values inside the
# container.
# Entry point is scripts/run.sh — it reads `model:` and `harness:` below,
# maps the matching .env group to the fixed variable names, runs preflight
# checks (image present and version-labeled, manifest in sync, Docker API,
# gateway reachable) and then `harbor run -c configs/opencode-harness.yaml`.
# Running harbor directly skips preflight and the env handling; source .env
# first. The agent's install() check still catches a missing or mismatched
# harness image.
#
# The api key is injected at run time with --agent-env as OPENAI_API_KEY.
# The `{env:OPENAI_API_KEY}` inside opencode_config is OpenCode's own
# in-container config syntax, resolved by the CLI inside the container.
# No `job_name:` on purpose: harbor names the results directory after it, and
# a fixed name makes the next run (e.g. switching to the oracle agent) fail
# with "directory already exists and cannot be resumed with a different
# config". The default job_name is a timestamp, one results dir per run.
#
# Combination declaration, read by run.sh (harbor's JobConfig ignores these
# two keys): model -> provider/model-id; the provider selects the matching
# .env group (go -> GO_*), and harness selects its manifest.
model: go/mimo-v2.6-flash
harness: opencode

jobs_dir: jobs
n_concurrent_trials: 4

# `tasks:` because the path points at a single task directory; a `datasets:`
# path must contain task subdirectories.
tasks:
  - path: tasks/hello-opencode

environment:
  type: docker
  import_path: harbor_test_env:HarborTestDockerEnvironment
  # Rebuild the task image from its current Dockerfile on every run (Docker
  # layer cache keeps this near-zero after the first build), and delete trial
  # containers when the trial ends; scripts/cleanup.sh covers interrupted runs.
  force_build: true
  delete: true
  mounts:
    # `source` must match harness/opencode/manifest.yaml (run.sh preflight
    # enforces this); `target` must match the manifest's mount_path.
    - type: image
      source: harbor-test/harness/opencode:2.0.28
      target: /usr/local
      read_only: true

agents:
  - import_path: harbor_test_agents:MountedOpenCode
    name: OpenCode
    kwargs:
      opencode_config:
        provider:
          gateway:
            npm: "@ai-sdk/openai-compatible"
            name: Custom gateway
            options:
              # {env:...}: OpenCode resolves this inside the container, fed
              # by --agent-env. The block is provider-neutral: any
              # OpenAI-compatible endpoint works via .env values alone.
              baseURL: "{env:OPENAI_BASE_URL}"
              apiKey: "{env:OPENAI_API_KEY}"
